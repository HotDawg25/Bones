<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Turtle Races</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sun:#f5d020;--track:#c8a855;--track2:#b89840;--grass:#5a9e38;--grass2:#4e8a30;
  --sky:#7ec8e3;--sky2:#a8dcf0;--wood:#8B5E3C;--wood2:#6B4424;
  --red:#e8412a;--blue:#2a7ae8;--green:#2ab85a;--yellow:#f5c518;--purple:#9b30e8;
  --crowd:#e8d0a0;--money:#27ae60;--danger:#e74c3c;
  --ui:#2c1a0e;--ui2:#3d2510;--card:#fffbf0;--border:#c8a050;
}
html,body{width:100%;height:100%;background:var(--sky);overflow:hidden;touch-action:none;}
body{font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* ── LAYOUT ── */
#game{width:700px;height:600px;position:relative;background:var(--sky);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.4);transform-origin:center center;}

/* ── TOP BAR ── */
#topbar{position:absolute;top:0;left:0;right:0;height:52px;background:var(--wood);border-bottom:4px solid var(--wood2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:30;}
#topbar h1{font-family:'Fredoka One',cursive;color:var(--sun);font-size:24px;letter-spacing:1px;text-shadow:2px 2px 0 var(--wood2);}
#money-display{background:var(--wood2);border:3px solid var(--sun);border-radius:20px;padding:4px 14px;display:flex;align-items:center;gap:6px;}
#money-display span{font-family:'Fredoka One',cursive;color:var(--sun);font-size:20px;}
.money-icon{font-size:18px;}

/* ── TABS ── */
#tabs{position:absolute;top:52px;left:0;right:0;height:36px;background:var(--wood2);display:flex;z-index:25;}
.tab{flex:1;border:none;background:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:rgba(255,255,255,0.55);cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid transparent;}
.tab.active{color:var(--sun);border-bottom-color:var(--sun);}
.tab:hover:not(.active){color:rgba(255,255,255,0.8);}

/* ── CANVAS ── */
#raceCanvas{position:absolute;top:88px;left:0;width:700px;height:512px;display:block;}

/* ── HUD OVERLAYS ── */
#race-hud{position:absolute;top:88px;left:0;right:0;pointer-events:none;z-index:20;}
#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Fredoka One',cursive;font-size:100px;color:#fff;text-shadow:4px 4px 0 var(--red),0 0 30px rgba(255,80,40,0.6);display:none;}
#race-result{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,251,240,0.97);border:5px solid var(--sun);border-radius:20px;padding:28px 40px;text-align:center;display:none;box-shadow:0 8px 40px rgba(0,0,0,0.4);}
#race-result h2{font-family:'Fredoka One',cursive;font-size:32px;color:var(--ui);margin-bottom:6px;}
#race-result .winner-name{font-size:22px;font-weight:800;margin:8px 0;}
#race-result .winnings{font-size:18px;font-weight:700;margin:6px 0;}
#race-result button{margin-top:14px;padding:10px 28px;background:var(--green);border:none;border-radius:20px;font-family:'Fredoka One',cursive;font-size:18px;color:#fff;cursor:pointer;transition:.15s;}
#race-result button:hover{filter:brightness(1.1);}

/* ── SIDE PANELS ── */
#side-panel{position:absolute;top:88px;right:0;width:220px;height:512px;background:rgba(44,26,14,0.95);border-left:3px solid var(--border);padding:12px;z-index:20;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}

/* BET CARDS */
.bet-card{background:var(--card);border:3px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;transition:all .15s;position:relative;}
.bet-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.25);}
.bet-card.selected{border-color:var(--money);box-shadow:0 0 0 3px rgba(39,174,96,0.3);}
.bet-card.selected::after{content:'✓ PICKED';position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;color:var(--money);}
.bet-turtle-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bet-turtle-preview{width:44px;height:32px;}
.bet-turtle-name{font-weight:800;font-size:13px;color:var(--ui);}
.bet-odds{font-size:11px;color:#888;font-weight:600;}
.bet-trait{font-size:10px;color:#a06030;font-style:italic;margin-top:2px;}

/* CLICKER */
#clicker-ui{position:absolute;top:88px;left:0;right:0;height:512px;z-index:18;pointer-events:none;}
#clicker-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(circle at 35% 35%, #6ee878, var(--green));border:6px solid var(--wood2);border-radius:50%;cursor:pointer;pointer-events:all;display:none;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 6px 0 #1a7a30,0 10px 20px rgba(0,0,0,0.3);transition:transform .08s,box-shadow .08s;user-select:none;}
#clicker-btn:active,#clicker-btn.pressed{transform:translateX(-50%) scale(0.94) translateY(4px);box-shadow:0 2px 0 #1a7a30,0 4px 10px rgba(0,0,0,0.3);}
#clicker-btn span{font-family:'Fredoka One',cursive;font-size:22px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.2);pointer-events:none;}
#clicker-btn small{font-size:11px;color:rgba(255,255,255,0.8);pointer-events:none;margin-top:2px;}
#click-count{position:absolute;bottom:235px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:18px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.5);pointer-events:none;display:none;}
#speed-bar-wrap{position:absolute;bottom:15px;left:10px;width:120px;display:none;}
#speed-bar-wrap label{font-size:10px;color:rgba(255,255,255,0.7);font-weight:700;display:block;margin-bottom:3px;}
#speed-bar{height:10px;background:rgba(255,255,255,0.2);border-radius:5px;overflow:hidden;}
#speed-fill{height:100%;background:var(--sun);border-radius:5px;transition:width .2s;}

/* BET AMOUNT */
#bet-section{background:var(--card);border:3px solid var(--border);border-radius:12px;padding:10px;margin-top:4px;}
#bet-section h3{font-weight:800;font-size:12px;color:var(--ui);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;}
#bet-amounts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.bet-amount-btn{padding:4px 10px;border:2px solid var(--border);background:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ui);cursor:pointer;transition:.12s;}
.bet-amount-btn.active{background:var(--money);border-color:var(--money);color:#fff;}
.bet-amount-btn:hover:not(.active){background:rgba(39,174,96,0.1);}
#go-btn{width:100%;padding:9px;background:var(--money);border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:16px;color:#fff;cursor:pointer;transition:.15s;box-shadow:0 3px 0 #1a7a30;}
#go-btn:hover{filter:brightness(1.1);}
#go-btn:disabled{background:#ccc;box-shadow:none;cursor:not-allowed;}
#race-mode-label{font-size:11px;color:rgba(255,255,255,0.6);text-align:center;margin-top:6px;font-weight:600;}

/* ── SHOP ── */
#shop-panel{position:absolute;inset:88px 0 0 0;background:rgba(44,26,14,0.98);z-index:35;display:none;overflow-y:auto;padding:16px;}
#shop-panel h2{font-family:'Fredoka One',cursive;color:var(--sun);font-size:26px;text-align:center;margin-bottom:14px;}
#shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.shop-item{background:var(--card);border:3px solid var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;}
.shop-item:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.3);}
.shop-item.owned{border-color:var(--money);background:#f0fff4;}
.shop-item canvas{display:block;margin:0 auto 8px;}
.shop-item .item-name{font-weight:800;font-size:13px;color:var(--ui);margin-bottom:3px;}
.shop-item .item-cost{font-weight:700;font-size:13px;color:var(--money);}
.shop-item .item-owned{font-size:11px;color:var(--money);font-weight:700;}
.shop-back{display:block;width:100%;margin-top:14px;padding:10px;background:var(--wood);border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:16px;color:var(--sun);cursor:pointer;}
.shop-back:hover{background:var(--wood2);}

/* ── TOAST ── */
#toast{position:absolute;top:100px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,0.85);color:#fff;padding:8px 20px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:50;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── NAME MODAL ── */
#name-modal{position:absolute;inset:0;background:rgba(20,12,4,0.92);z-index:60;display:flex;align-items:center;justify-content:center;}
#name-modal-box{background:var(--card);border:5px solid var(--sun);border-radius:20px;padding:28px 32px;text-align:center;max-width:340px;box-shadow:0 10px 50px rgba(0,0,0,0.5);}
#name-modal-box h2{font-family:'Fredoka One',cursive;font-size:24px;color:var(--ui);margin-bottom:8px;}
#name-modal-box p{font-size:13px;color:#777;margin-bottom:16px;}
#turtle-name-input{width:100%;padding:10px 14px;border:3px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--ui);}
#turtle-name-input:focus{outline:none;border-color:var(--money);}
#name-confirm-btn{width:100%;padding:11px;background:var(--money);border:none;border-radius:12px;font-family:'Fredoka One',cursive;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 3px 0 #1a7a30;}
#name-confirm-btn:hover{filter:brightness(1.1);}

/* ── REDEEM CODE ── */
#redeem-section{background:var(--card);border:3px dashed var(--border);border-radius:12px;padding:10px;margin-top:10px;}
#redeem-section h3{font-weight:800;font-size:11px;color:#999;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
#redeem-input{width:100%;padding:6px 10px;border:2px solid var(--border);border-radius:8px;font-family:'Nunito',sans-serif;font-size:12px;margin-bottom:6px;}
#redeem-btn{width:100%;padding:7px;background:var(--wood);border:none;border-radius:8px;font-family:'Fredoka One',cursive;font-size:13px;color:var(--sun);cursor:pointer;}
#redeem-btn:hover{background:var(--wood2);}

/* ── MOD MENU TAB & PANEL ── */
.tab.mod-tab{display:none;color:#ff66ff !important;}
.tab.mod-tab.unlocked{display:block;}
#mod-panel{position:absolute;inset:88px 0 0 0;background:rgba(20,4,30,0.98);z-index:35;display:none;overflow-y:auto;padding:20px;}
#mod-panel h2{font-family:'Fredoka One',cursive;color:#ff66ff;font-size:26px;text-align:center;margin-bottom:16px;text-shadow:0 0 12px rgba(255,102,255,0.6);}
.mod-btn{display:block;width:100%;max-width:340px;margin:0 auto 10px;padding:12px;background:#3a1a4a;border:2px solid #ff66ff;border-radius:12px;font-family:'Fredoka One',cursive;font-size:15px;color:#fff;cursor:pointer;transition:.15s;}
.mod-btn:hover{background:#5a2a6a;}
#mod-winner-select{width:100%;max-width:340px;display:block;margin:0 auto 10px;padding:10px;border-radius:10px;border:2px solid #ff66ff;font-family:'Nunito',sans-serif;font-size:13px;}
.mod-back{display:block;width:100%;max-width:340px;margin:14px auto 0;padding:10px;background:var(--wood);border:none;border-radius:10px;font-family:'Fredoka One',cursive;font-size:16px;color:var(--sun);cursor:pointer;}

/* ── BENDER EVENT ── */
#bender-banner{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#ff4444;padding:8px 20px;border-radius:12px;font-family:'Fredoka One',cursive;font-size:16px;display:none;z-index:22;text-align:center;box-shadow:0 0 20px rgba(255,0,0,0.4);}
</style>
</head>
<body>
<div id="game">
  <div id="name-modal">
    <div id="name-modal-box">
      <h2>🐢 Name Your Turtle!</h2>
      <p>This is the turtle you'll control and cheer for. Choose wisely.</p>
      <input type="text" id="turtle-name-input" placeholder="e.g. Shelly" maxlength="16"/>
      <button id="name-confirm-btn" onclick="confirmTurtleName()">Let's Race! →</button>
    </div>
  </div>
  <div id="topbar">
    <h1>🐢 Turtle Races</h1>
    <div id="money-display"><span class="money-icon">💰</span><span id="money-val">$50</span></div>
  </div>
  <div id="tabs">
    <button class="tab active" onclick="setTab('race')">🏁 Race</button>
    <button class="tab" onclick="setTab('clicker')">👆 Clicker</button>
    <button class="tab" onclick="setTab('shop')">🛒 Shop</button>
    <button class="tab mod-tab" id="mod-tab-btn" onclick="setTab('mods')">🛠️ Mods</button>
  </div>

  <canvas id="raceCanvas" width="700" height="512"></canvas>

  <div id="bender-banner">🤖 BENDER: "BITE MY SHINY METAL FOOT!"</div>

  <div id="race-hud">
    <div id="countdown">3</div>
    <div id="race-result">
      <h2>🏆 Race Over!</h2>
      <div class="winner-name" id="winner-name"></div>
      <div class="winnings" id="winnings-text"></div>
      <button onclick="newRace()">Next Race →</button>
    </div>
  </div>

  <div id="clicker-ui">
    <div id="click-count">Clicks: 0</div>
    <div id="speed-bar-wrap"><label>Speed</label><div id="speed-bar"><div id="speed-fill" style="width:0%"></div></div></div>
    <button id="clicker-btn" onclick="doClick()">
      <span>TAP!</span>
      <small>to run faster</small>
    </button>
  </div>

  <div id="side-panel" id="side-panel">
    <div id="race-mode-label">PICK A TURTLE TO CHEER</div>
    <div id="turtle-cards"></div>
    <div id="bet-section">
      <h3>Bet Amount</h3>
      <div id="bet-amounts">
        <button class="bet-amount-btn active" onclick="setBet(5)">$5</button>
        <button class="bet-amount-btn" onclick="setBet(10)">$10</button>
        <button class="bet-amount-btn" onclick="setBet(20)">$20</button>
        <button class="bet-amount-btn" onclick="setBet(50)">$50</button>
      </div>
      <button id="go-btn" onclick="startRace()">🏁 Start Race!</button>
    </div>
  </div>

  <div id="shop-panel">
    <h2>🛒 Shell Shop</h2>
    <div id="shop-grid"></div>
    <div id="redeem-section">
      <h3>Have a code?</h3>
      <input type="text" id="redeem-input" placeholder="Enter code..."/>
      <button id="redeem-btn" onclick="redeemCode()">Redeem</button>
    </div>
    <button class="shop-back" onclick="setTab('race')">← Back to Race</button>
  </div>

  <div id="mod-panel">
    <h2>🛠️ Mod Menu</h2>
    <button class="mod-btn" onclick="modAddMoney()">💰 Add $1000</button>
    <button class="mod-btn" onclick="modUnlockAll()">🔓 Unlock All Accessories</button>
    <button class="mod-btn" onclick="modInfiniteBoost()">♾️ <span id="mod-boost-label">Enable Infinite Click Boost</span></button>
    <select id="mod-winner-select"></select>
    <button class="mod-btn" onclick="modRigRace()">🎯 Rig Next Race Winner</button>
    <button class="mod-back" onclick="setTab('race')">← Back to Race</button>
  </div>

  <div id="toast"></div>
</div>

<script>
const canvas = document.getElementById('raceCanvas');
const ctx = canvas.getContext('2d');
const W = 700, H = 512;

// ── TURTLE DEFINITIONS ──────────────────────────────────────────
const TURTLE_DEFS = [
  { name: 'Shelly',    color: '#4a9e30', shellCol: '#2d6e1a', belly: '#a8d878', trait: 'Very determined. Hates puddles.',    baseSpeed: 0.9, luck: 0.5, quirk: 'sneeze' },
  { name: 'Turbo',     color: '#2a7ae8', shellCol: '#1a4a9a', belly: '#a0c8f8', trait: 'Believes very hard in himself.',     baseSpeed: 1.1, luck: 0.4, quirk: 'burst' },
  { name: 'Grandma',   color: '#e89030', shellCol: '#a05c10', belly: '#f8d090', trait: 'She\'s been here before. All of it.', baseSpeed: 0.7, luck: 0.8, quirk: 'nap' },
  { name: 'Speedy',    color: '#e83060', shellCol: '#9a1040', belly: '#f890a8', trait: 'Extremely caffeinated somehow.',      baseSpeed: 1.2, luck: 0.3, quirk: 'jitter' },
  { name: 'Leafy',     color: '#30c870', shellCol: '#1a8040', belly: '#90f0b0', trait: 'Easily distracted by leaves.',        baseSpeed: 0.95,luck: 0.6, quirk: 'leaf' },
];

// ── ACCESSORIES ─────────────────────────────────────────────────
const ACCESSORIES = [
  { id:'crown',   name:'Tiny Crown',   cost:30,  draw:(ctx,x,y)=>{ ctx.fillStyle='#ffd700';ctx.fillRect(x-8,y-28,16,10);ctx.fillRect(x-10,y-34,4,8);ctx.fillRect(x-2,y-36,4,10);ctx.fillRect(x+6,y-34,4,8); } },
  { id:'hat',     name:'Top Hat',      cost:25,  draw:(ctx,x,y)=>{ ctx.fillStyle='#1a1a1a';ctx.fillRect(x-10,y-18,20,4);ctx.fillRect(x-7,y-34,14,18); } },
  { id:'flower',  name:'Flower',       cost:15,  draw:(ctx,x,y)=>{ ctx.fillStyle='#ff69b4';for(let i=0;i<5;i++){const a=i/5*Math.PI*2;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*6,y-24+Math.sin(a)*6,4,4,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(x,y-24,4,0,Math.PI*2);ctx.fill(); } },
  { id:'glasses', name:'Cool Shades',  cost:20,  draw:(ctx,x,y)=>{ ctx.fillStyle='#1a1a1a';ctx.fillRect(x-12,y-8,9,6);ctx.fillRect(x+3,y-8,9,6);ctx.fillRect(x-3,y-5,6,2); } },
  { id:'scarf',   name:'Racing Scarf', cost:35,  draw:(ctx,x,y)=>{ ctx.fillStyle='#ff4040';ctx.fillRect(x+8,y-4,14,4);ctx.fillRect(x+10,y,8,14);ctx.fillStyle='#ff8080';ctx.fillRect(x+8,y-4,14,2); } },
  { id:'party',   name:'Party Hat',    cost:18,  draw:(ctx,x,y)=>{ ctx.fillStyle='#ff00ff';ctx.beginPath();ctx.moveTo(x,y-38);ctx.lineTo(x-9,y-20);ctx.lineTo(x+9,y-20);ctx.closePath();ctx.fill();ctx.fillStyle='#ffff00';for(let i=0;i<3;i++){ctx.fillRect(x-6+i*6,y-20,3,3);} } },
  { id:'monocle', name:'Monocle',      cost:22,  draw:(ctx,x,y)=>{ ctx.strokeStyle='#c0a000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+6,y-6,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x+11,y-6);ctx.lineTo(x+16,y-2);ctx.stroke(); } },
  { id:'wings',   name:'Tiny Wings',   cost:50,  draw:(ctx,x,y)=>{ ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.ellipse(x-16,y-8,10,6,0.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+16,y-8,10,6,-0.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(180,200,255,0.7)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x-16,y-8,10,6,0.4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(x+16,y-8,10,6,-0.4,0,Math.PI*2);ctx.stroke(); } },
];

// ── GAME STATE ───────────────────────────────────────────────────
let money = 50;
let currentTab = 'race';
let raceState = 'betting'; // betting | countdown | racing | finished
let selectedTurtle = -1;  // which turtle player cheers (spectator)
let betAmount = 5;
let turtles = [];
let countdownVal = 3;
let clickBoost = 0;  // boost from clicking (clicker mode)
let playerTurtleIdx = 0; // in clicker mode, player IS turtle 0
let isClickerMode = false;
let clicksThisRace = 0;
let raceFinished = false;
let winnerIdx = -1;
let ownedAccessories = new Set();
let equippedAccessory = null;
let particles = [];
let confetti = [];
let playerTurtleName = 'Shelly';
let isFirstRace = true;
let squirtleCheatActive = false;
let modMenuUnlocked = false;
let infiniteBoost = false;
let riggedWinnerIdx = -1;
let bender = null; // {phase, x, y, targetIdx, timer}
let benderUsedThisRace = false;

// track layout
const TRACK_TOP = 40;
const LANE_H = 68;
const FINISH_X = 640;
const START_X = 60;

function initTurtles() {
  turtles = TURTLE_DEFS.map((def, i) => ({
    ...def,
    name: i === 0 ? playerTurtleName : def.name,
    x: START_X,
    y: TRACK_TOP + LANE_H * i + LANE_H / 2 - 10,
    speed: 0,
    tired: 0,
    quirkTimer: Math.random() * 120,
    quirkActive: false,
    quirkDuration: 0,
    wobble: 0,
    legPhase: Math.random() * Math.PI * 2,
    finished: false,
    finishTime: 0,
    place: 0,
    sneezeParticles: [],
  }));
}

// ── DRAWING ──────────────────────────────────────────────────────
function drawTurtle(ctx, t, idx) {
  const x = t.x, y = t.y;
  const wobble = Math.sin(t.legPhase) * 2;
  const s = 1;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x+4, y+16, 18, 5, 0, 0, Math.PI*2); ctx.fill();

  // SHELL
  ctx.fillStyle = t.shellCol;
  ctx.beginPath(); ctx.ellipse(x, y-2+wobble, 22, 15, 0, 0, Math.PI*2); ctx.fill();
  // shell hexagon pattern
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let dr = 0; dr < 3; dr++) {
    for (let dc = 0; dc < 4; dc++) {
      ctx.beginPath();
      ctx.ellipse(x - 12 + dc * 8, y - 8 + dr * 7 + wobble, 3, 2.5, dc * 0.3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // shell shine
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(x-6, y-10+wobble, 7, 4, -0.5, 0, Math.PI*2); ctx.fill();

  // BODY / BELLY
  ctx.fillStyle = t.belly;
  ctx.beginPath(); ctx.ellipse(x, y+6+wobble, 14, 7, 0, 0, Math.PI*2); ctx.fill();

  // LEGS (4 stubby ones)
  ctx.fillStyle = t.color;
  const legWobble = Math.sin(t.legPhase) * 5;
  // front legs
  ctx.beginPath(); ctx.ellipse(x+10, y+12+wobble+legWobble, 5, 4, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x-10, y+12+wobble-legWobble, 5, 4, -0.5, 0, Math.PI*2); ctx.fill();
  // back legs
  ctx.beginPath(); ctx.ellipse(x+12, y+3+wobble-legWobble*0.5, 4, 3, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x-12, y+3+wobble+legWobble*0.5, 4, 3, -0.8, 0, Math.PI*2); ctx.fill();

  // HEAD
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.ellipse(x+20, y-2+wobble, 10, 8, 0.2, 0, Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(x+26, y-5+wobble, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x+27, y-6+wobble, 1, 0, Math.PI*2); ctx.fill();
  // mouth (tiny smile or different expressions)
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  if (t.quirkActive && t.quirk === 'nap') {
    // closed eyes sleeping
    ctx.beginPath(); ctx.moveTo(x+24,y-5+wobble); ctx.lineTo(x+28,y-5+wobble); ctx.stroke();
    // zzz
    ctx.fillStyle = '#88aacc';
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('z', x+30, y-12+wobble);
    ctx.fillText('Z', x+34, y-18+wobble);
  } else {
    ctx.beginPath(); ctx.arc(x+25, y-1+wobble, 2, 0.1, Math.PI-0.1); ctx.stroke();
  }
  // tail
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.ellipse(x-19, y+1+wobble, 5, 3, -0.3, 0, Math.PI*2); ctx.fill();

  // SNEEZE particles
  if (t.quirkActive && t.quirk === 'sneeze') {
    ctx.fillStyle = 'rgba(150,220,255,0.7)';
    t.sneezeParticles.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    });
  }

  // ACCESSORIES (on player's turtle in clicker, on bought turtles)
  if (idx === 0 && equippedAccessory) {
    const acc = ACCESSORIES.find(a => a.id === equippedAccessory);
    if (acc) acc.draw(ctx, x, y + wobble);
  }

  // name label
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.font = 'bold 10px Nunito, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(t.name, x, y + 26 + wobble);

  // place badge
  if (t.finished && t.place > 0) {
    const badge = ['🥇','🥈','🥉'][t.place-1] || t.place+'th';
    ctx.font = '16px sans-serif';
    ctx.fillText(badge, x+28, y-22+wobble);
  }
}

function drawTrack() {
  const t = Date.now() * 0.001;

  // sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, TRACK_TOP);
  skyGrad.addColorStop(0, '#7ec8e3'); skyGrad.addColorStop(1, '#a8dcf0');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, TRACK_TOP);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [[100,15,30,14],[280,10,40,16],[480,18,28,12],[600,12,36,14]].forEach(([cx,cy,rw,rh])=>{
    ctx.beginPath(); ctx.ellipse(cx+(t*8%W),cy,rw,rh,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+(t*8%W)+20,cy-5,rw*0.7,rh*0.7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+(t*8%W)-20,cy-3,rw*0.6,rh*0.6,0,0,Math.PI*2); ctx.fill();
  });

  // grass borders
  ctx.fillStyle = '#5a9e38'; ctx.fillRect(0, TRACK_TOP, W, 8);
  ctx.fillStyle = '#5a9e38'; ctx.fillRect(0, TRACK_TOP + LANE_H * TURTLE_DEFS.length, W, 8);

  // lanes
  for (let i = 0; i < TURTLE_DEFS.length; i++) {
    const ly = TRACK_TOP + 8 + i * LANE_H;
    ctx.fillStyle = i % 2 === 0 ? '#c8a855' : '#b89840';
    ctx.fillRect(0, ly, W, LANE_H);
    // lane dividers
    if (i > 0) {
      ctx.strokeStyle = 'rgba(180,150,50,0.5)'; ctx.lineWidth = 1;
      ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // crowd in background
  drawCrowd(t);

  // START line
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(START_X-10, TRACK_TOP+8); ctx.lineTo(START_X-10, TRACK_TOP+8+LANE_H*TURTLE_DEFS.length); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Nunito,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('START', START_X-10, TRACK_TOP+4);

  // FINISH line (checkered)
  const sqSize = 10;
  for (let row = 0; row < LANE_H * TURTLE_DEFS.length / sqSize; row++) {
    for (let col = 0; col < 2; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(FINISH_X + col*sqSize, TRACK_TOP+8 + row*sqSize, sqSize, sqSize);
    }
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Nunito,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('FINISH', FINISH_X + sqSize, TRACK_TOP+4);

  // lane numbers + selected highlight
  for (let i = 0; i < TURTLE_DEFS.length; i++) {
    const ly = TRACK_TOP + 8 + i * LANE_H;
    if (selectedTurtle === i || (isClickerMode && i === playerTurtleIdx)) {
      ctx.fillStyle = 'rgba(39,174,96,0.18)';
      ctx.fillRect(0, ly, W, LANE_H);
      ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
      ctx.strokeRect(0, ly, W-220, LANE_H);
    }
  }
}

function drawCrowd(t) {
  const crowdY = TRACK_TOP + 8 + LANE_H * TURTLE_DEFS.length + 6;
  for (let i = 0; i < 30; i++) {
    const cx = 20 + i * 23;
    const cy = crowdY + 10 + Math.sin(i + t * 2) * 4;
    const col = ['#e8d0a0','#f0b880','#d0a888','#c88860','#e0c090'][i % 5];
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(cx, cy+2, 5, 0, Math.PI*2); ctx.fill();
  }
}

function drawParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
  });
  ctx.globalAlpha = 1;
}

function drawConfetti() {
  confetti.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.col;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
    c.x += c.vx; c.y += c.vy; c.vy += 0.2; c.rot += c.drot; c.vy = Math.min(c.vy, 6);
  });
  confetti = confetti.filter(c => c.y < H + 20);
}

function spawnConfetti() {
  const colors = ['#ff3366','#ffcc00','#33ccff','#99ff33','#ff9900','#cc33ff'];
  for (let i = 0; i < 80; i++) {
    confetti.push({
      x: Math.random()*W, y: -20, vx: (Math.random()-.5)*4,
      vy: 1+Math.random()*3, rot: Math.random()*Math.PI*2,
      drot: (Math.random()-.5)*0.2,
      w: 6+Math.random()*8, h: 4+Math.random()*6,
      col: colors[Math.floor(Math.random()*colors.length)]
    });
  }
}

// ── RACE LOGIC ────────────────────────────────────────────────
function updateTurtles(dt) {
  if (raceState !== 'racing') return;

  let allFinished = turtles.every(t => t.finished);
  if (allFinished) { endRace(); return; }

  let placeCounter = turtles.filter(t => t.finished).length;

  maybeTriggerBender();
  updateBender();

  turtles.forEach((t, i) => {
    if (t.finished) return;
    // Bender is actively kicking this turtle backward - skip its normal movement
    if (bender && bender.targetIdx === i && bender.phase === 'kicking') return;

    t.legPhase += 0.15 + t.speed * 0.1;

    // quirk timer
    t.quirkTimer -= dt * 60;
    if (t.quirkTimer <= 0 && !t.quirkActive) {
      t.quirkTimer = 80 + Math.random() * 180;
      if (Math.random() < 0.35) {
        t.quirkActive = true;
        t.quirkDuration = 30 + Math.random() * 60;
        if (t.quirk === 'sneeze') {
          for (let j = 0; j < 6; j++) t.sneezeParticles.push({
            x: t.x + 26, y: t.y, vx: 2+Math.random()*3, vy: (Math.random()-.5)*2, r: 2+Math.random()*2, life: 20
          });
        }
      }
    }
    if (t.quirkActive) {
      t.quirkDuration--;
      if (t.quirkDuration <= 0) { t.quirkActive = false; t.sneezeParticles = []; }
    }
    t.sneezeParticles.forEach(p => { p.x+=p.vx;p.y+=p.vy;p.life--; });
    t.sneezeParticles = t.sneezeParticles.filter(p=>p.life>0);

    // speed calculation
    let spd = t.baseSpeed * (0.8 + Math.random() * 0.4);
    // luck burst
    if (Math.random() < t.luck * 0.02) spd *= 2.5;
    // quirk slowdowns
    if (t.quirkActive) {
      if (t.quirk === 'nap') spd *= 0.1;
      if (t.quirk === 'leaf') spd *= 0.4;
      if (t.quirk === 'sneeze') spd *= 0.6;
    }
    if (t.quirk === 'burst' && Math.random() < 0.03) spd *= 3;
    if (t.quirk === 'jitter') spd *= (0.5 + Math.random() * 1.5);

    // clicker boost on player's turtle
    if (isClickerMode && i === playerTurtleIdx) {
      if (infiniteBoost) clickBoost = 3.5;
      spd += clickBoost;
      if (!infiniteBoost) clickBoost = Math.max(0, clickBoost - 0.04);
    }

    // secret cheat: naming your turtle Squirtle wins the first race, guaranteed
    if (squirtleCheatActive && isFirstRace && i === 0) spd *= 6;
    // mod menu: rigged race winner
    if (riggedWinnerIdx === i) spd *= 6;

    t.tired += spd * 0.001;
    spd *= Math.max(0.4, 1 - t.tired * 0.3);

    t.x += spd * dt * 60 * 0.8;

    // wobble
    t.y += Math.sin(t.legPhase * 0.5) * 0.4;

    if (t.x >= FINISH_X) {
      t.x = FINISH_X;
      t.finished = true;
      placeCounter++;
      t.place = placeCounter;
      particles.push(...[...Array(20)].map(()=>({
        x:FINISH_X, y:t.y, vx:(Math.random()-.5)*8, vy:-Math.random()*10,
        vy: -3-Math.random()*6, color:['#ff3','#f93','#3f9','#39f','#f39'][Math.floor(Math.random()*5)],
        r: 4+Math.random()*5, life: 40, maxLife: 40
      })));
    }
  });
}

function endRace() {
  if (raceFinished) return;
  raceFinished = true;
  raceState = 'finished';
  winnerIdx = turtles.findIndex(t => t.place === 1);
  spawnConfetti();

  // one-shot effects only apply for a single race
  if (isFirstRace) { isFirstRace = false; squirtleCheatActive = false; }
  riggedWinnerIdx = -1;
  bender = null;
  document.getElementById('bender-banner').style.display = 'none';

  const winner = turtles[winnerIdx];
  let earnMsg = '';
  let earn = 5; // participation money
  money += earn;
  earnMsg = `+$${earn} for participating`;

  if (!isClickerMode && selectedTurtle === winnerIdx) {
    const odds = getOdds(selectedTurtle);
    const winAmt = Math.floor(betAmount * odds);
    money += winAmt;
    earnMsg = `+$${winAmt} (${odds}x odds)`;
  } else if (!isClickerMode && selectedTurtle >= 0 && betAmount > 0) {
    money -= betAmount;
    earnMsg = `-$${betAmount} (wrong pick)`;
    earn = -betAmount;
    money += 5;
    earnMsg = `-$${betAmount - 5} bet lost, +$5 participation`;
  } else if (isClickerMode && winnerIdx === playerTurtleIdx) {
    money += 25;
    earnMsg = '+$25 you won your race!';
  }

  updateMoneyDisplay();

  document.getElementById('winner-name').textContent = `🐢 ${winner.name} wins!`;
  document.getElementById('winner-name').style.color = winner.shellCol;
  document.getElementById('winnings-text').textContent = earnMsg;
  document.getElementById('winnings-text').style.color = earn >= 0 ? '#27ae60' : '#e74c3c';

  setTimeout(() => {
    document.getElementById('race-result').style.display = 'block';
  }, 1200);
}

function getOdds(idx) {
  const t = TURTLE_DEFS[idx];
  const odds = [3.5, 2.0, 5.0, 1.8, 2.8];
  return odds[idx] || 2;
}

// ── COUNTDOWN & START ─────────────────────────────────────────
function startRace() {
  if (raceState === 'racing' || raceState === 'countdown') return;
  raceFinished = false;
  confetti = [];
  bender = null; benderUsedThisRace = false;
  document.getElementById('bender-banner').style.display = 'none';
  initTurtles();
  raceState = 'countdown';
  document.getElementById('race-result').style.display = 'none';
  document.getElementById('side-panel').style.pointerEvents = 'none';

  // Setup clicker UI
  const clickerMode = currentTab === 'clicker';
  isClickerMode = clickerMode;
  clickBoost = 0; clicksThisRace = 0;
  document.getElementById('clicker-btn').style.display = clickerMode ? 'flex' : 'none';
  document.getElementById('click-count').style.display = clickerMode ? 'block' : 'none';
  document.getElementById('speed-bar-wrap').style.display = clickerMode ? 'block' : 'none';

  countdownVal = 3;
  const cd = document.getElementById('countdown');
  cd.style.display = 'block';
  cd.textContent = '3';
  const tick = setInterval(() => {
    countdownVal--;
    if (countdownVal <= 0) {
      clearInterval(tick);
      cd.textContent = 'GO!';
      cd.style.color = '#27ae60';
      setTimeout(() => { cd.style.display = 'none'; raceState = 'racing'; }, 600);
    } else {
      cd.textContent = countdownVal;
      cd.style.color = countdownVal === 1 ? '#e83060' : '#fff';
    }
  }, 900);
}

function newRace() {
  raceState = 'betting';
  selectedTurtle = -1;
  raceFinished = false;
  winnerIdx = -1;
  confetti = [];
  document.getElementById('race-result').style.display = 'none';
  document.getElementById('side-panel').style.pointerEvents = '';
  document.getElementById('clicker-btn').style.display = 'none';
  document.getElementById('click-count').style.display = 'none';
  document.getElementById('speed-bar-wrap').style.display = 'none';
  document.getElementById('countdown').style.color = '#fff';
  initTurtles();
  buildSidePanel();
  updateMoneyDisplay();
}

// ── CLICKER ───────────────────────────────────────────────────
function doClick() {
  if (raceState !== 'racing') return;
  clicksThisRace++;
  clickBoost = Math.min(clickBoost + 0.25, 3.5);
  document.getElementById('click-count').textContent = `Clicks: ${clicksThisRace}`;
  document.getElementById('speed-fill').style.width = (clickBoost / 3.5 * 100) + '%';

  const btn = document.getElementById('clicker-btn');
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 80);
}

// ── BETTING UI ────────────────────────────────────────────────
function buildSidePanel() {
  const panel = document.getElementById('turtle-cards');
  panel.innerHTML = '';
  TURTLE_DEFS.forEach((def, i) => {
    const card = document.createElement('div');
    card.className = 'bet-card';
    card.dataset.idx = i;

    const previewCanvas = document.createElement('canvas');
    previewCanvas.width = 44; previewCanvas.height = 32;
    previewCanvas.className = 'bet-turtle-preview';
    const pc = previewCanvas.getContext('2d');
    // mini turtle preview
    pc.fillStyle = def.shellCol;
    pc.beginPath(); pc.ellipse(22,14,18,11,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = def.belly;
    pc.beginPath(); pc.ellipse(22,20,12,6,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = def.color;
    pc.beginPath(); pc.ellipse(36,13,8,6,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = '#1a1a1a';
    pc.beginPath(); pc.arc(40,10,1.5,0,Math.PI*2); pc.fill();

    const odds = getOdds(i);
    card.innerHTML = `
      <div class="bet-turtle-row">
        <div style="font-size:13px;font-weight:800;color:${def.shellCol}">🐢 ${i===0?playerTurtleName:def.name}</div>
        <span class="bet-odds">${odds}x odds</span>
      </div>
      <div class="bet-trait">"${def.trait}"</div>
    `;
    card.insertBefore(previewCanvas, card.firstChild);
    card.querySelector('.bet-turtle-row').insertBefore(document.createElement('span'), card.querySelector('.bet-turtle-row').firstChild);

    card.onclick = () => {
      if (raceState !== 'betting') return;
      selectedTurtle = i;
      document.querySelectorAll('.bet-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
    panel.appendChild(card);
  });
}

function setBet(amt) {
  betAmount = amt;
  document.querySelectorAll('.bet-amount-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.textContent.replace('$','')) === amt);
  });
}

// ── SHOP ──────────────────────────────────────────────────────
function buildShop() {
  const grid = document.getElementById('shop-grid');
  grid.innerHTML = '';
  ACCESSORIES.forEach(acc => {
    const owned = ownedAccessories.has(acc.id);
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '');

    const previewC = document.createElement('canvas');
    previewC.width = 80; previewC.height = 60;
    const pc = previewC.getContext('2d');
    // draw small turtle with the accessory
    pc.fillStyle = '#2d6e1a'; pc.beginPath(); pc.ellipse(40,34,20,13,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = '#a8d878'; pc.beginPath(); pc.ellipse(40,40,13,7,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = '#4a9e30'; pc.beginPath(); pc.ellipse(56,31,9,7,0,0,Math.PI*2); pc.fill();
    pc.fillStyle = '#1a1a1a'; pc.beginPath(); pc.arc(61,28,2,0,Math.PI*2); pc.fill();
    acc.draw(pc, 40, 36);

    div.appendChild(previewC);
    div.innerHTML += `
      <div class="item-name">${acc.name}</div>
      ${owned
        ? `<div class="item-owned">${equippedAccessory===acc.id?'✓ Equipped':'Owned'}</div>`
        : `<div class="item-cost">$${acc.cost}</div>`}
    `;

    div.onclick = () => {
      if (owned) {
        equippedAccessory = equippedAccessory === acc.id ? null : acc.id;
        buildShop();
        showToast(equippedAccessory ? `Equipped ${acc.name}!` : 'Unequipped');
      } else if (money >= acc.cost) {
        money -= acc.cost;
        ownedAccessories.add(acc.id);
        equippedAccessory = acc.id;
        updateMoneyDisplay();
        buildShop();
        showToast(`Bought ${acc.name}! 🎉`);
      } else {
        showToast('Not enough money! 💸');
      }
    };
    grid.appendChild(div);
  });
}

// ── NAMING MODAL ──────────────────────────────────────────────
function confirmTurtleName() {
  const input = document.getElementById('turtle-name-input');
  const val = input.value.trim();
  playerTurtleName = val || 'Shelly';

  // secret cheat: naming your turtle Squirtle auto-wins the first race
  if (playerTurtleName.toLowerCase() === 'squirtle') {
    squirtleCheatActive = true;
    showToast('🐢 A wild Squirtle appears...');
  }

  document.getElementById('name-modal').style.display = 'none';
  initTurtles();
  buildSidePanel();
}

// ── REDEEM CODE / MOD MENU ────────────────────────────────────
function redeemCode() {
  const input = document.getElementById('redeem-input');
  const code = input.value.trim().toLowerCase();
  if (code === 'squirtle sent me') {
    modMenuUnlocked = true;
    document.getElementById('mod-tab-btn').classList.add('unlocked');
    showToast('🔓 Secret Mod Menu unlocked!');
    input.value = '';
  } else if (code.length > 0) {
    showToast('❌ Invalid code');
  }
}

function buildModMenu() {
  const sel = document.getElementById('mod-winner-select');
  sel.innerHTML = '';
  TURTLE_DEFS.forEach((def, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i === 0 ? playerTurtleName : def.name;
    sel.appendChild(opt);
  });
  document.getElementById('mod-boost-label').textContent = infiniteBoost ? 'Disable Infinite Click Boost' : 'Enable Infinite Click Boost';
}

function modAddMoney() {
  money += 1000;
  updateMoneyDisplay();
  showToast('💰 +$1000 (mod menu)');
}

function modUnlockAll() {
  ACCESSORIES.forEach(a => ownedAccessories.add(a.id));
  showToast('🔓 All accessories unlocked!');
}

function modInfiniteBoost() {
  infiniteBoost = !infiniteBoost;
  buildModMenu();
  showToast(infiniteBoost ? '♾️ Infinite boost ON' : 'Infinite boost OFF');
}

function modRigRace() {
  riggedWinnerIdx = parseInt(document.getElementById('mod-winner-select').value);
  const name = riggedWinnerIdx === 0 ? playerTurtleName : TURTLE_DEFS[riggedWinnerIdx].name;
  showToast(`🎯 Next race is rigged for ${name}!`);
}

// ── BENDER EVENT ──────────────────────────────────────────────
// A random chance, only while your turtle is winning, that Bender shows up
// and kicks your turtle around a bunch. Purely comedic - big speed penalty
// while it's happening.
function getFocusTurtleIdx() {
  return isClickerMode ? playerTurtleIdx : selectedTurtle;
}

function maybeTriggerBender() {
  if (bender || benderUsedThisRace) return;
  const focusIdx = getFocusTurtleIdx();
  if (focusIdx < 0) return;
  const focus = turtles[focusIdx];
  if (!focus || focus.finished) return;

  // is focus turtle currently in 1st place among unfinished turtles?
  const stillRacing = turtles.filter(t => !t.finished);
  const isLeading = stillRacing.every(t => t === focus || t.x <= focus.x);
  if (!isLeading) return;

  if (Math.random() < 0.006) {
    benderUsedThisRace = true;
    bender = { phase: 'run-in', x: focus.x + 260, y: focus.y - 60, targetIdx: focusIdx, timer: 0, kicks: 0 };
    document.getElementById('bender-banner').style.display = 'block';
  }
}

function updateBender() {
  if (!bender) return;
  const t = turtles[bender.targetIdx];
  bender.timer++;

  if (bender.phase === 'run-in') {
    bender.x -= 8; bender.y += (t.y - bender.y) * 0.1;
    if (bender.x <= t.x + 24) { bender.phase = 'kicking'; bender.timer = 0; }
  } else if (bender.phase === 'kicking') {
    t.speed = 0;
    t.x = Math.max(START_X, t.x - 3); // gets kicked backwards!
    if (bender.timer % 12 === 0) {
      bender.kicks++;
      particles.push(...[...Array(8)].map(() => ({
        x: t.x, y: t.y, vx: (Math.random()-.5)*6, vy: -Math.random()*6,
        color: '#888', r: 3+Math.random()*3, life: 20, maxLife: 20
      })));
    }
    if (bender.kicks >= 4) { bender.phase = 'run-out'; bender.timer = 0; }
  } else if (bender.phase === 'run-out') {
    bender.x -= 10;
    if (bender.x < -60) {
      bender = null;
      document.getElementById('bender-banner').style.display = 'none';
    }
  }
}

function drawBender() {
  if (!bender) return;
  const x = bender.x, y = bender.y;
  ctx.save(); ctx.translate(x, y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 18, 12, 3, 0, 0, Math.PI*2); ctx.fill();
  // legs
  const legKick = bender.phase === 'kicking' && Math.floor(bender.timer/6)%2===0 ? 10 : 0;
  ctx.fillStyle = '#888';
  ctx.fillRect(-8, 4, 6, 12);
  ctx.fillRect(2, 4 - legKick*0.3, 6, 12 + legKick);
  // feet
  ctx.fillStyle = '#555';
  ctx.fillRect(-10, 14, 8, 4);
  ctx.fillRect(0, 14 - legKick*0.3, 10 + legKick, 4);
  // cylindrical body
  ctx.fillStyle = '#a8a8b0';
  ctx.fillRect(-9, -14, 18, 20);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(-9, -14, 6, 20);
  // chest panel
  ctx.fillStyle = '#555';
  ctx.fillRect(-5, -6, 10, 8);
  // arms
  ctx.fillStyle = '#999';
  ctx.fillRect(-13, -10, 4, 14);
  ctx.fillRect(9, -10, 4, 14);
  // head
  ctx.fillStyle = '#b0b0b8';
  ctx.fillRect(-7, -26, 14, 12);
  // single eye
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(0, -20, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4ae0ff';
  ctx.beginPath(); ctx.arc(0, -20, 2, 0, Math.PI*2); ctx.fill();
  // antenna
  ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(5,-26); ctx.lineTo(9,-32); ctx.stroke();
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(9,-32,2,0,Math.PI*2); ctx.fill();
  // speech bubble while kicking
  if (bender.phase === 'kicking') {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.roundRect(-40, -58, 80, 24, 6); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('TAKE THAT', 0, -46);
    ctx.fillText('MEATBAG!', 0, -36);
  }
  ctx.restore();
}

// ── TABS ──────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['race','clicker','shop','mods'][i]===tab));
  document.getElementById('shop-panel').style.display = tab === 'shop' ? 'block' : 'none';
  document.getElementById('mod-panel').style.display = tab === 'mods' ? 'block' : 'none';
  document.getElementById('side-panel').style.display = (tab !== 'shop' && tab !== 'mods') ? 'flex' : 'none';

  const modeLabel = document.getElementById('race-mode-label');
  if (tab === 'clicker') {
    modeLabel.textContent = `YOU ARE ${playerTurtleName.toUpperCase()} — CLICK TO RUN!`;
  } else {
    modeLabel.textContent = 'PICK A TURTLE TO BET ON';
  }

  if (tab === 'shop') buildShop();
  if (tab === 'mods') buildModMenu();
}

// ── UTILITIES ─────────────────────────────────────────────────
function updateMoneyDisplay() {
  document.getElementById('money-val').textContent = `$${money}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── MAIN LOOP ─────────────────────────────────────────────────
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  ctx.clearRect(0, 0, W, H);
  drawTrack();
  updateTurtles(dt);
  turtles.forEach((t, i) => drawTurtle(ctx, t, i));
  drawBender();
  drawParticles();
  drawConfetti();

  requestAnimationFrame(loop);
}

// ── BOOT ──────────────────────────────────────────────────────
initTurtles();
buildSidePanel();
updateMoneyDisplay();
document.getElementById('side-panel').style.display = 'flex';
setTab('race');
requestAnimationFrame(loop);

// Scale to fit small screens without changing internal canvas resolution
function fitToScreen(){
  const scale = Math.min(window.innerWidth/700, window.innerHeight/600, 1);
  document.getElementById('game').style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitToScreen);
fitToScreen();
</script>
